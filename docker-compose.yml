# Local environment for HealthPay: PostgreSQL, Redis, Kafka and (optionally) the app.
# Settings come from .env (copy .env.example to .env first).
#
# Only the dependencies (use this when you run the app with ./mvnw):
#   docker compose up -d
#   docker compose ps                              wait until all show (healthy)
#   docker compose down                            stop (database data is kept)
#   docker compose down -v                         stop and DELETE database data
#
# Dependencies AND the app, built from the Dockerfile (no Java needed):
#   docker compose --profile app up -d --build
#   docker compose --profile app down

name: healthpay

services:
  postgres:
    image: postgres:17-alpine
    container_name: healthpay-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-healthpay}
      POSTGRES_USER: ${DB_USERNAME:-healthpay}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set - run: cp .env.example .env}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: healthpay-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners:
  #   PLAINTEXT_HOST -> localhost:9092 for the app running on your machine
  #   PLAINTEXT      -> kafka:29092 for other containers (used when the app runs in Docker, Phase 20)
  kafka:
    image: apache/kafka:4.2.0
    container_name: healthpay-kafka
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # The HealthPay application, built from the Dockerfile.
  # Inside Docker, the app reaches the other services by their service names
  # (postgres, redis, kafka) and their internal ports, not localhost.
  app:
    profiles: ["app"]
    build: .
    image: healthpay-app:local
    container_name: healthpay-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-healthpay}
      DB_USERNAME: ${DB_USERNAME:-healthpay}
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set - run: cp .env.example .env}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: "8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
